name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Unit tests
        run: npm test

      - name: Architecture rules (dependency-cruiser)
        run: npm run dep:check

      - name: Build + zip (Chrome)
        run: npm run zip

      - name: Build + zip (Firefox)
        run: npm run zip:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: whatsit-extensions
          path: .output/*.zip
