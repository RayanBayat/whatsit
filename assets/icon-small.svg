<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Simplified mark for 16-32 px: detail from the full icon turns to mush
       at favicon size, so small sizes get gradient + bold glyph only. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA0FF"/>
      <stop offset="1" stop-color="#1B4DDB"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M 42 47 C 42 33 51 25 64 25 C 78 25 86 34 86 46 C 86 58 77 62 70 68 C 65 72 64 76 64 83"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
  <circle cx="64" cy="105" r="9.5" fill="#FFFFFF"/>
</svg>
